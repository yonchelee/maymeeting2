<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>5.27초 멈추기 — 월례회 챌린지</title>
<style>
  :root {
    --bg: #0f1226;
    --card: #1b1f3b;
    --accent: #ffd54a;
    --accent2: #6c8cff;
    --good: #46d39a;
    --bad: #ff6b6b;
    --text: #f4f6ff;
    --muted: #9aa0c3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #2a2f5e 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 28px 16px 60px;
  }
  .wrap {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 22px;
  }
  @media (max-width: 760px) {
    .wrap { grid-template-columns: 1fr; }
  }
  header {
    grid-column: 1 / -1;
    text-align: center;
    margin-bottom: 4px;
  }
  header h1 {
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: -1px;
  }
  header h1 .num { color: var(--accent); }
  header p { color: var(--muted); margin-top: 8px; font-size: 15px; }

  .card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 26px 24px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
  }

  .name-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .name-row input {
    flex: 1;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: #11142b;
    color: var(--text);
    font-size: 16px;
    outline: none;
  }
  .name-row input:focus { border-color: var(--accent2); }

  .stage {
    text-align: center;
    padding: 30px 10px 24px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(108,140,255,0.08), rgba(108,140,255,0));
    margin-bottom: 20px;
  }
  .target { color: var(--muted); font-size: 15px; }
  .target b { color: var(--accent); font-size: 19px; }
  .display {
    font-size: clamp(52px, 14vw, 96px);
    font-weight: 800;
    letter-spacing: -2px;
    margin: 14px 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .display.hidden-run { color: var(--accent2); }
  .display .unit { font-size: 0.4em; color: var(--muted); margin-left: 6px; }
  .hint { color: var(--muted); font-size: 14px; min-height: 20px; }
  .result-line { font-size: 16px; min-height: 24px; margin-top: 6px; }
  .result-line .err-good { color: var(--good); font-weight: 700; }
  .result-line .err-bad { color: var(--bad); font-weight: 700; }

  .btn {
    width: 100%;
    padding: 18px;
    font-size: 20px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform .05s ease, filter .15s ease;
    color: #14162c;
  }
  .btn:active { transform: translateY(2px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-start { background: var(--accent); }
  .btn-stop { background: var(--bad); color: #fff; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.14);
    font-size: 14px;
    padding: 10px;
    width: auto;
  }

  .board-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .board-head h2 { font-size: 20px; }
  .board-actions { display: flex; gap: 8px; }
  .refreshing { opacity: .5; pointer-events: none; }
  .board { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .board li {
    display: grid;
    grid-template-columns: 38px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: #14172f;
    border-radius: 11px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .board li.me { border-color: var(--accent); background: #1d2142; }
  .board .rank { font-weight: 800; font-size: 18px; color: var(--muted); text-align: center; }
  .board li:nth-child(1) .rank { color: #ffd54a; }
  .board li:nth-child(2) .rank { color: #cdd3e8; }
  .board li:nth-child(3) .rank { color: #e0a96d; }
  .board .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .who small { display:block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .board .score { font-variant-numeric: tabular-nums; font-weight: 700; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span class="num">5.27</span>초 멈추기</h1>
      <p>화면을 보지 말고 감으로! 정확히 <b>5.27초</b>에 멈추세요. 오차가 가장 작은 사람이 우승 🏆</p>
    </header>

    <!-- GAME PANEL -->
    <section class="card">
      <div class="name-row">
        <input id="playerName" type="text" placeholder="플레이어 이름" maxlength="16" autocomplete="off" />
      </div>

      <div class="stage">
        <div class="target">목표: <b>5.27</b> 초</div>
        <div id="display" class="display">0.00<span class="unit">초</span></div>
        <div id="hint" class="hint">이름을 입력하고 시작하세요.</div>
        <div id="resultLine" class="result-line"></div>
      </div>

      <button id="actionBtn" class="btn btn-start">시작</button>
    </section>

    <!-- LEADERBOARD PANEL -->
    <section class="card">
      <div class="board-head">
        <h2>🏆 순위표</h2>
        <div class="board-actions">
          <button id="refreshBtn" class="btn btn-ghost">↻ 새로고침</button>
          <button id="resetBtn" class="btn btn-ghost">기록 초기화</button>
        </div>
      </div>
      <ul id="board" class="board"></ul>
    </section>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  var TARGET = 5.27;            // 목표 시간(초)
  var LOCK_KEY = "stop527_played_v1";   // 기기당 1회 플레이 잠금
  var IS_ADMIN = /[?&]admin\b/.test(location.search);  // ?admin 으로 접속 시 진행자 모드

  // === Supabase 설정 ===
  var SUPABASE_URL = "https://xetzgpvyiwnwuzhephpl.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhldHpncHZ5aXdud3V6aGVwaHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MDQxNzUsImV4cCI6MjA5NTM4MDE3NX0.TCX-_CSZHhhkXboIuVi0GZfbybKmomh7q9ZsAMAx--c";
  var sb = (window.supabase && SUPABASE_ANON_KEY !== "PASTE_ANON_KEY_HERE")
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  var nameInput  = document.getElementById("playerName");
  var display    = document.getElementById("display");
  var hint       = document.getElementById("hint");
  var resultLine = document.getElementById("resultLine");
  var actionBtn  = document.getElementById("actionBtn");
  var resetBtn   = document.getElementById("resetBtn");
  var refreshBtn = document.getElementById("refreshBtn");
  var boardEl    = document.getElementById("board");

  // state: "idle" | "running" | "locked"
  var state = "idle";
  var startTime = 0;
  var lastEntryId = null;

  // Supabase에서 상위 점수 조회 (오차 오름차순)
  function fetchScores() {
    if (!sb) return Promise.resolve(null);
    return sb.from("scores")
      .select("id,name,time_sec,error_sec")
      .order("error_sec", { ascending: true })
      .limit(20)
      .then(function (res) {
        if (res.error) { console.error(res.error); return null; }
        return res.data;
      })
      .catch(function (e) { console.error(e); return null; });
  }

  // 플레이 결과 저장 → 저장된 행(id 포함) 반환
  function insertScore(name, timeSec, errorSec) {
    if (!sb) return Promise.resolve(null);
    return sb.from("scores")
      .insert({ name: name, time_sec: timeSec, error_sec: errorSec })
      .select("id")
      .single()
      .then(function (res) {
        if (res.error) { console.error(res.error); return null; }
        return res.data;
      })
      .catch(function (e) { console.error(e); return null; });
  }

  function getLock() {
    try {
      var raw = localStorage.getItem(LOCK_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function setLock(entry) {
    try { localStorage.setItem(LOCK_KEY, JSON.stringify(entry)); } catch (e) {}
  }
  function clearLock() {
    try { localStorage.removeItem(LOCK_KEY); } catch (e) {}
  }

  function showBoardMessage(msg) {
    boardEl.innerHTML = "";
    var li = document.createElement("li");
    li.className = "empty";
    li.style.gridColumn = "1 / -1";
    li.textContent = msg;
    boardEl.appendChild(li);
  }

  function renderBoard() {
    if (!sb) {
      showBoardMessage("순위표 서버가 설정되지 않았습니다. (anon 키 확인 필요)");
      return Promise.resolve();
    }
    return fetchScores().then(function (scores) {
      if (scores === null) {
        showBoardMessage("순위표를 불러오지 못했습니다. 잠시 후 다시 시도됩니다.");
        return;
      }
      if (scores.length === 0) {
        showBoardMessage("아직 기록이 없습니다. 첫 도전자가 되어보세요!");
        return;
      }

      boardEl.innerHTML = "";
      scores.slice(0, 12).forEach(function (s, i) {
        var li = document.createElement("li");
        if (s.id === lastEntryId) li.className = "me";

        var medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i + 1);

        var rank = document.createElement("div");
        rank.className = "rank";
        rank.textContent = medal;

        var who = document.createElement("div");
        who.className = "who";
        who.innerHTML = escapeHtml(s.name) +
          "<small>멈춘 시간 " + Number(s.time_sec).toFixed(2) + "초</small>";

        var score = document.createElement("div");
        score.className = "score";
        score.textContent = "±" + Number(s.error_sec).toFixed(2) + "초";

        li.appendChild(rank);
        li.appendChild(who);
        li.appendChild(score);
        boardEl.appendChild(li);
      });
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function setDisplay(value, running) {
    display.textContent = value;
    var unit = document.createElement("span");
    unit.className = "unit";
    unit.textContent = "초";
    display.appendChild(unit);
    display.classList.toggle("hidden-run", !!running);
  }

  function toIdle() {
    state = "idle";
    actionBtn.textContent = "시작";
    actionBtn.className = "btn btn-start";
    actionBtn.disabled = false;
    actionBtn.style.display = "";
    nameInput.disabled = false;
    nameInput.style.display = "";
    setDisplay("0.00", false);
    hint.textContent = "이름을 입력하고 시작하세요.";
  }

  // 이미 플레이한 기기: 새로고침/재접속해도 잠긴 상태 유지
  function toLocked(entry) {
    state = "locked";
    nameInput.style.display = "none";
    actionBtn.style.display = "none";
    setDisplay(entry.time.toFixed(2), false);
    resultLine.innerHTML = "내 오차 ±" + entry.error.toFixed(2) + "초";
    hint.innerHTML = "🔒 <b>" + escapeHtml(entry.name) +
      "</b>님은 이미 참여하셨습니다.<br>1인 1회만 도전할 수 있어요. 결과를 기다려 주세요!";
  }

  function startGame() {
    var name = nameInput.value.trim();
    if (!name) {
      hint.textContent = "먼저 이름을 입력해주세요!";
      nameInput.focus();
      return;
    }
    state = "running";
    startTime = performance.now();
    nameInput.disabled = true;
    actionBtn.textContent = "멈춤!";
    actionBtn.className = "btn btn-stop";
    resultLine.innerHTML = "";
    // 시간 숨김: 흐르는 동안 숫자 안 보여줌
    setDisplay("●●●", true);
    hint.textContent = "감으로 5.27초를 세고 멈추세요. (숫자는 가려져 있어요)";
  }

  function stopGame() {
    state = "done";
    var elapsed = (performance.now() - startTime) / 1000;
    var error = Math.abs(elapsed - TARGET);

    setDisplay(elapsed.toFixed(2), false);

    var cls = error <= 0.10 ? "err-good" : error <= 0.50 ? "" : "err-bad";
    var praise = error <= 0.03 ? " 🎯 완벽!"
               : error <= 0.10 ? " 👏 대단해요!"
               : error <= 0.30 ? " 👍 좋아요!"
               : "";
    resultLine.innerHTML = "오차 <span class='" + cls + "'>±" +
      error.toFixed(2) + "초</span>" + praise;
    hint.textContent = "기록이 순위표에 등록되었습니다.";

    var entry = { name: nameInput.value.trim(), time: elapsed, error: error };
    setLock(entry);          // 기기 잠금: 재참가 차단 (서버 저장 실패와 무관하게)

    // 서버에 기록 저장 → 통합 순위표 반영
    insertScore(entry.name, elapsed, error).then(function (row) {
      if (row) lastEntryId = row.id;   // 내 기록 강조용
      renderBoard();
    });

    // 잠깐 결과를 보여준 뒤 잠금 화면으로 전환
    setTimeout(function () { toLocked(entry); }, 1500);
  }

  actionBtn.addEventListener("click", function () {
    if (state === "idle") startGame();
    else if (state === "running") stopGame();
  });

  // 스페이스바로도 조작 (행사장에서 빠르게)
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && document.activeElement !== nameInput) {
      e.preventDefault();
      actionBtn.click();
    }
  });

  // 순위표 새로고침 — 게임이 끝나 잠긴 뒤에도 누구나 최신 순위 확인 가능
  refreshBtn.addEventListener("click", function () {
    boardEl.classList.add("refreshing");
    Promise.resolve(renderBoard()).then(function () {
      boardEl.classList.remove("refreshing");
    });
  });

  // 진행자(?admin)만 초기화 버튼 노출 — 참가자가 잠금을 못 풀게
  if (IS_ADMIN) {
    resetBtn.textContent = "이 기기 잠금 해제";
    resetBtn.addEventListener("click", function () {
      if (confirm("이 기기의 플레이 잠금을 해제할까요? (서버 순위표는 그대로 유지됩니다)")) {
        clearLock();
        lastEntryId = null;
        toIdle();
        renderBoard();
      }
    });
  } else {
    resetBtn.style.display = "none";
  }

  // init: 이미 플레이한 기기면 잠금 화면, 아니면 대기 화면
  var existingLock = getLock();
  if (existingLock && !IS_ADMIN) {
    toLocked(existingLock);
  } else {
    toIdle();
  }
  renderBoard();

  // 모든 폰에서 통합 순위표가 최신으로 보이도록 갱신
  if (sb) {
    // 실시간: 새 기록이 들어오면 즉시 갱신
    sb.channel("scores-live")
      .on("postgres_changes",
          { event: "INSERT", schema: "public", table: "scores" },
          function () { renderBoard(); })
      .subscribe();
    // 보조: 실시간 누락 대비 10초마다 갱신
    setInterval(renderBoard, 10000);
  }
})();
</script>
</body>
</html>
